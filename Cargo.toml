[package]
name = "bluecraft"
version = "0.3.0"
edition = "2021"
description = "BlueCraft: a creative voxel sandbox built with BlueEngine."

# The rules are a plain library so they can be tested without a window; the window is the binary.
[lib]
name = "bluecraft"
path = "src/lib.rs"

[features]
default = ["client"]
client = ["vesper3d/native-client", "dep:macroquad", "dep:windows-sys", "dep:audrey"]

[[bin]]
name = "bluecraft"
path = "src/main.rs"
required-features = ["client"]

[dependencies]
vesper3d = { package = "be2", path = "../bluecraft-engine", default-features = false }
macroquad = { optional = true, version = "=0.4.14", default-features = false, features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
audrey = { optional = true, version = "=0.3.0", default-features = false, features = ["ogg_vorbis"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { optional = true, version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse"] }

# A frame here is real work (mesh building, effects), so debug builds must stay playable for captures
# and scripted runs: the game at opt-level 2, dependencies at 3.
[profile.dev]
opt-level = 2
debug = 1
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
